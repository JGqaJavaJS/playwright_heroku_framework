# Allure Report Configuration
# Directory where test results (JSON files) will be written during test execution.
# This path must match the one configured in pom.xml (systemPropertyVariables).
allure.results.directory=target/allure-results

# Report metadata (optional but recommended for professional reports)
allure.link.issue.pattern=https://jira.yourcompany.com/browse/{}
allure.link.tms.pattern=https://tms.yourcompany.com/browse/{}